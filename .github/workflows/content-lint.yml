name: content-lint
# 直推 content/ 即发布（Pages 在 push 时自行构建，不看本任务状态）；
# 本工作流提供快速失败信号：slug/标题/日期不合规时标红本次 push。
on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - run: python scripts/lint-content.py
