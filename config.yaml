baseurl: "https://xiaowenz.com/"
title: "三杯过后 | Xiaowen.Z Deployed"
theme: "xuanmo"
hasCJKLanguage: true
enableEmoji: true
defaultContentLanguage: zh
timeZone: "Asia/Shanghai"
summaryLength: 90

# URL 冻结：与 Typlog 现状 1:1，迁移零 301
permalinks:
  blog: "/blog/:slug.html"
  episodes: "/episodes/:slug"
  recipes: "/recipes/:slug"   # 菜谱（2026-11 新增 URL 族，拼音 slug，与 episodes 同风格）

taxonomies:
  tag: "tags"

# /feed.xml（全文 RSS）与 /feed/audio.xml（播客 iTunes RSS）
outputFormats:
  rss:
    baseName: feed
  podcast:
    mediaType: "application/rss+xml"
    baseName: audio
    path: feed

outputs:
  home: [HTML, RSS, PODCAST]
  section: [HTML]
  page: [HTML]
  taxonomy: [HTML]
  term: [HTML]

markup:
  goldmark:
    renderer:
      unsafe: true   # 迁移内容含 HTML 块（表格、figure）
    parser:
      attribute:
        block: true
  highlight:
    noClasses: false
    style: monokailight

sitemap:
  changefreq: weekly
  priority: 1.0
  filename: sitemap.xml

minify:
  minifyOutput: true

# 顶部导航唯一数据源：nav=primary 一级平铺，nav=more 进「更多」下拉（见 header.html）。
# 首页入口由 brand 与页脚承担，不设菜单项；播客平台外链见 params.podcast，配置后自动出现在下拉底部。
menu:
  main:
    - name: "本站播客"
      url: "/episodes/"
      weight: 1
      params: { nav: primary }
    - name: "专栏文章"
      url: "/tags/newsletter/"
      weight: 2
      params: { nav: primary }
    - name: "读书"
      url: "/read-books/"
      weight: 3
      params: { nav: primary }
    - name: "商业分析"
      url: "/business-reports/"
      weight: 4
      params: { nav: primary }
    - name: "关于"
      url: "/about/"
      weight: 5
      params: { nav: primary }
    - name: "Service 和爱发电"
      url: "/service-and-afdian/"
      weight: 6
      params: { nav: more }
    - name: "菜谱收藏"
      url: "/recipes/"
      weight: 7
      params: { nav: more }
    - name: "服务器推荐"
      url: "/server-recommend/"
      weight: 8
      params: { nav: more }
    - name: "搜索"
      url: "/search/"
      weight: 9
      params: { nav: more }

params:
  description: "一个写了将近20年的博客，突然开始有趣起来了……"
  tagline: "以吾之秩序 丈量二进制的世界"
  heroTitle: "以吾之秩序<br>丈量二进制的世界"
  author: "Xiaowen Zhang"
  # —— 动态服务对接（core）——
  coreAPI: "https://core.xiaowenz.com"      # core 服务地址：评论/订阅/统计
  turnstileSiteKey: "0x4AAAAAAD9ld48ic8P_EOhV"   # Cloudflare Turnstile site key（公开标识符，可入公开仓库）
  gaID: "G-7T4RZQ5V58"                       # Google Analytics，置空关闭
  # —— 播客 enclosure 计数地址前缀（core 的 302 统计端点）——
  audioBase: "https://core.xiaowenz.com/a/"
  # —— 播客平台元数据（与 Typlog feed 保持一致）——
  podcast:
    guid: "3c09eb14-0c6a-5777-a8ac-e06f8b21b2c4"
    title: "三杯过后"
    subtitle: "商业和科技的深度小样"
    author: "Xiaowen Zhang"
    email: "xiaowen.z@outlook.com"
    keywords: "商业,科技,职场,投资"
    explicit: "no"
    type: "episodic"
    image: "https://media.xiaowenz.com/images/podcast-cover.jpg"
    categories: ["Technology", "Business:Management", "Business:Investing", "News:Tech News"]
    spotify: ""
    apple: ""
    xiaoyuzhou: ""
    netease: ""
  social:
    rss: "/feed.xml"
