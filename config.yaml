baseurl: "https://xiaowenz.com/"
title: "三杯过后 | Xiaowen.Z Deployed"
theme: "xuanmo"
hasCJKLanguage: true
enableEmoji: true
defaultContentLanguage: zh
timeZone: "Asia/Shanghai"
summaryLength: 90

# URL 冻结：与 Typlog 现状 1:1，迁移零 301
permalinks:
  blog: "/blog/:slug.html"
  episodes: "/episodes/:slug"

taxonomies:
  tag: "tags"

# /feed.xml（全文 RSS）与 /feed/audio.xml（播客 iTunes RSS）
outputFormats:
  rss:
    baseName: feed
  podcast:
    mediaType: "application/rss+xml"
    baseName: audio
    path: feed

outputs:
  home: [HTML, RSS, PODCAST]
  section: [HTML]
  page: [HTML]
  taxonomy: [HTML]
  term: [HTML]

markup:
  goldmark:
    renderer:
      unsafe: true   # 迁移内容含 HTML 块（表格、figure）
    parser:
      attribute:
        block: true
  highlight:
    noClasses: false
    style: monokailight

sitemap:
  changefreq: weekly
  priority: 1.0
  filename: sitemap.xml

minify:
  minifyOutput: true

menu:
  main:
    - name: "Home"
      url: "/"
      weight: 1
    - name: "本站播客"
      url: "/episodes/"
      weight: 2
    - name: "Read"
      url: "/read-books/"
      weight: 3
    - name: "Newsletter"
      url: "/tags/newsletter/"
      weight: 4
    - name: "UK Company"
      url: "/run-a-uk-company/"
      weight: 5
    - name: "Service 和爱发电"
      url: "/service-and-afdian/"
      weight: 6
    - name: "Business 商业分析"
      url: "/business-reports/"
      weight: 7
    - name: "About"
      url: "/about/"
      weight: 8
    - name: "搜索"
      url: "/search/"
      weight: 9

